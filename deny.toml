[graph]
all-features = true

[advisories]
ignore       = []
unmaintained = "all"
unsound      = "all"
yanked       = "deny"

[licenses]
allow                = ["Apache-2.0", "BlueOak-1.0.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
allow-wildcard-paths = true
deny = [
  { crate = "aws-lc-rs", reason = "ADR-0004 permits ring as the sole rustls provider" },
  { crate = "aws-lc-sys", reason = "ADR-0004 permits ring as the sole rustls provider" },
  { crate = "native-tls", reason = "ADR-0004 requires the reviewed rustls TLS 1.3 stack" },
  { crate = "openssl", reason = "ADR-0004 forbids OpenSSL and alternate TLS providers" },
  { crate = "openssl-sys", reason = "ADR-0004 forbids OpenSSL and alternate TLS providers" },
]
highlight = "all"
multiple-versions = "deny"
multiple-versions-include-dev = true
skip = [
  { crate = "getrandom@0.3.4", reason = "owner=T-G01-05: proptest uses getrandom 0.3 while production uses getrandom 0.4" },
  { crate = "r-efi@5.3.0", reason = "owner=T-G01-05: target-only dependency of the reviewed getrandom 0.3 dev duplicate" },
  { crate = "syn@2.0.119", reason = "owner=T-G01-05: minicbor-derive uses syn 2 while tokio-macros uses syn 3" },
]
wildcards = "deny"

[sources]
allow-git        = []
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
unknown-git      = "deny"
unknown-registry = "deny"
