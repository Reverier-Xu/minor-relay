schema = "relay.woooo.tech/schemas/threat-model-v1"
status = "accepted"

[[threat]]
id = "THR-001"
mandatory_key = "credential-guessing"
title = "Credential guessing, theft, and admission flooding"
priority = "P0"
owner_task = "T-G03-06"
scenario_ids = ["SC-G03-P0-18", "SC-G03-P0-22", "E2E-01"]
mitigation = "Use a 256-bit ten-minute single-use credential, constant-time proof, generic failures, 4/64 pending and 16/256-per-minute source/global limits, 1,024 expiring source buckets, one verified committer, and a ten-second deadline."
residual = "An unused credential copied from the application can admit one identity before expiry; a distributed flood can consume the bounded global allowance."
status = "accepted"

[[threat]]
id = "THR-002"
mandatory_key = "replay"
title = "Authentication, control, delivery, and record replay"
priority = "P0"
owner_task = "T-G03-06"
scenario_ids = ["SC-G03-P0-18", "SC-G06-P0-05", "SC-G07-P0-01", "E2E-05"]
mitigation = "Bind proofs to fresh nonces, roles, TLS exporter, cluster and complete offers; key durable delivery by trace/digest/ordinal; make signed record replay idempotent."
residual = "Replay can consume bounded parser, signature, and lookup work before rejection."
status = "accepted"

[[threat]]
id = "THR-003"
mandatory_key = "impersonation"
title = "Peer impersonation, MITM, and reflection"
priority = "P0"
owner_task = "T-G03-06"
scenario_ids = ["SC-G03-P0-19", "SC-G03-P0-20", "SC-G04-P0-03", "E2E-01"]
mitigation = "Validate TLS 1.3 CertificateVerify, derive RFC 9266 exporter locally, use role-separated HKDF/HMAC and Ed25519 signatures, and require reciprocal exact key trust."
residual = "A compromised private key or hostile in-process key provider can impersonate its bound identity."
status = "accepted"

[[threat]]
id = "THR-004"
mandatory_key = "identity-clones"
title = "Identity clone, collision, and key substitution"
priority = "P0"
owner_task = "T-G03-06"
scenario_ids = ["SC-G02-P0-02", "SC-G03-P0-19", "SC-G04-P0-05", "E2E-03"]
mitigation = "Bind immutable random NodeId to one Ed25519 public key, fail closed on collisions/conflicts, verify possession each session, and create a new identity after key loss."
residual = "Copying the same private key and durable identity state creates an indistinguishable clone; operators must protect and avoid duplicating stores."
status = "accepted"

[[threat]]
id = "THR-005"
mandatory_key = "sybil-admission"
title = "Sybil admission and credential-generation equivocation"
priority = "P0"
owner_task = "T-G03-03"
scenario_ids = ["SC-G03-P0-07", "SC-G03-P0-08", "SC-G03-P0-09", "E2E-01"]
mitigation = "Permit one committed subject per issuer generation, reserve one verified commit, reconcile unknown outcomes, and propagate issuer-signed grants."
residual = "An authorized malicious issuer can intentionally rotate credentials and admit many identities up to the 1,024-member ceiling."
status = "accepted"

[[threat]]
id = "THR-006"
mandatory_key = "stale-metadata"
title = "Stale endpoint, descriptor, trust, state, and resource replay"
priority = "P0"
owner_task = "T-G05-01"
scenario_ids = [
  "SC-G05-P0-03",
  "SC-G05-P0-04",
  "SC-G05-P0-08",
  "SC-G09-P0-03",
  "E2E-03",
]
mitigation = "Use identity-scoped endpoint expiry, signed monotonic revisions/removal markers, strict LWW ordering, durable tombstones, and normal bounded anti-entropy."
residual = "Offline data may remain stale until connectivity returns; explicit tombstone cleanup can permit acknowledged stale resurrection."
status = "accepted"

[[threat]]
id = "THR-007"
mandatory_key = "protocol-downgrade"
title = "Protocol, feature, limit, and schema downgrade"
priority = "P0"
owner_task = "T-G03-04"
scenario_ids = [
  "SC-G03-P0-10",
  "SC-G03-P0-11",
  "SC-G03-P0-12",
  "SC-G03-P0-13",
  "SC-G03-P0-14",
  "E2E-09",
]
mitigation = "Transcript-bind complete offers and definition digests, compute exact dependency-closed intersection and minimum limits, fail required/conflict/mismatch cases, and never retry a weaker offer."
residual = "Two peers can use only behavior they both explicitly offered; unavailable optional behavior is not an attack."
status = "accepted"

[[threat]]
id = "THR-008"
mandatory_key = "route-amplification"
title = "Route amplification, cycle, retry, and fan-out abuse"
priority = "P0"
owner_task = "T-G06-01"
scenario_ids = [
  "SC-G06-P0-02",
  "SC-G06-P0-03",
  "SC-G06-P0-04",
  "SC-G06-P0-08",
  "E2E-05",
]
mitigation = "Only source signs ordinals zero through three; enforce 15 hops, one pinned next hop, persist-before-write, no forwarder retry/fan-out, and per-source/global quotas."
residual = "Write-boundary crashes can duplicate a bounded physical edge write."
status = "accepted"

[[threat]]
id = "THR-009"
mandatory_key = "oversized-payloads"
title = "Malformed, noncanonical, deeply nested, or oversized input"
priority = "P0"
owner_task = "T-G03-06"
scenario_ids = ["SC-G01-P0-01", "SC-G03-P0-21", "SC-G03-P0-22", "SC-G10-P0-10"]
mitigation = "Validate the fixed prelude before allocation, enforce frame/body/collection/depth bounds, require deterministic CBOR and canonical tags, fuzz all decoders, and reject text/compression."
residual = "Inputs at the legal ceiling consume the explicitly budgeted parser and allocation work."
status = "accepted"

[[threat]]
id = "THR-010"
mandatory_key = "slow-peers"
title = "Slow peer, queue, task, and resource saturation"
priority = "P0"
owner_task = "T-G04-04"
scenario_ids = [
  "SC-G04-P0-12",
  "SC-G04-P0-13",
  "SC-G04-P0-14",
  "SC-G04-P0-15",
  "SC-G10-P0-17",
]
mitigation = "Bound queue count/bytes, correlations, tasks, keepalive/idle/auth deadlines, maintenance concurrency and durable quotas; apply backpressure and assert post-quiescence baselines."
residual = "Enough authenticated colluding members can hold the global bounded allowance and reduce availability."
status = "accepted"

[[threat]]
id = "THR-011"
mandatory_key = "future-timestamps"
title = "Future timestamp, bad clock, rollback, and sample manipulation"
priority = "P0"
owner_task = "T-G07-01"
scenario_ids = ["SC-G07-P0-01", "SC-G07-P0-02", "SC-G07-P1-03", "SC-G07-P0-16"]
mitigation = "Use authenticated fresh peer samples, checked persistent HLC/watermark, health-gated local writes, five-second skew quarantine, 24-hour horizon, and deterministic maturation."
residual = "A quorum of malicious trusted peers can bias agreement within configured bounds; hostile host time is outside the core trust boundary."
status = "accepted"

[[threat]]
id = "THR-012"
mandatory_key = "malicious-members"
title = "Authorized malicious or colluding members"
priority = "P0"
owner_task = "T-G09-04"
scenario_ids = [
  "SC-G06-P0-08",
  "SC-G07-P0-06",
  "SC-G09-P0-13",
  "SC-G09-P0-14",
  "E2E-08",
]
mitigation = "Authenticate every source, validate signatures/tags/owners, enforce per-source/global quotas, emit bounded equivocation evidence, and durably revoke before closing sessions."
residual = "Revoke removes connectivity and authorization but does not invalidate signed state/resource history; pre-signed or colluder-relayed content remains convergence-eligible and explicit cleanup is required."
status = "accepted"

[[threat]]
id = "THR-013"
mandatory_key = "secret-disclosure"
title = "Credential, private key, transcript, payload, and environment disclosure"
priority = "P0"
owner_task = "T-G01-04"
scenario_ids = ["SC-G01-P0-04", "SC-G02-P0-03", "SC-G10-P0-16", "SC-G10-P0-37"]
mitigation = "Use non-display secret types, opaque key handles, allowlisted bounded diagnostics, forbidden-field validation, corpus screening, normalized artifacts, and no raw database/key upload."
residual = "A hostile process, OS, hypervisor, debugger, or application retaining secret/provider authority can read material in its protection domain."
status = "accepted"

[[threat]]
id = "THR-014"
mandatory_key = ""
title = "Canonical encoding, schema, tag, and registry confusion"
priority = "P0"
owner_task = "T-G03-01"
scenario_ids = ["SC-G03-P0-01", "SC-G03-P0-02", "SC-G10-P0-01", "SC-G10-P0-05"]
mitigation = "Use immutable opaque IDs and definitions, deterministic bytes, category/domain validation, duplicate/cycle/conflict rejection, exact decoder lookup, and golden vectors."
residual = "A new semantic definition requires a new immutable label/schema ID and compatibility evidence."
status = "accepted"

[[threat]]
id = "THR-015"
mandatory_key = ""
title = "Admission unknown outcome and double commit"
priority = "P0"
owner_task = "T-G03-03"
scenario_ids = ["SC-G03-P0-07", "SC-G03-P0-08", "SC-G03-P0-09"]
mitigation = "Commit binding, credential use and grant atomically; quarantine Unknown; reconcile by TxnId/digest; never retry with a new subject or operation identity."
residual = "Networking remains unavailable while authoritative storage reconciliation cannot complete."
status = "accepted"

[[threat]]
id = "THR-016"
mandatory_key = ""
title = "Address identity misbinding and crossed-dial race"
priority = "P0"
owner_task = "T-G04-02"
scenario_ids = [
  "SC-G04-P0-05",
  "SC-G04-P0-08",
  "SC-G04-P0-09",
  "SC-G04-P0-11",
  "E2E-03",
]
mitigation = "Treat addresses as expiring identity-scoped candidates, authenticate before activation, choose session ownership from stable identities, and drain replacements deterministically."
residual = "An attacker can advertise unreachable candidates and consume bounded connection attempts."
status = "accepted"

[[threat]]
id = "THR-017"
mandatory_key = ""
title = "Forged or equivocating admission grant and trust snapshot"
priority = "P0"
owner_task = "T-G04-05"
scenario_ids = ["SC-G04-P0-16", "SC-G04-P0-17", "SC-G04-P0-18", "SC-G04-P0-19"]
mitigation = "Verify trusted issuer, cluster, canonical contents, revision and signature; persist reciprocal exact bindings; fail closed on NodeId/key conflict without selecting a winner."
residual = "A malicious currently trusted issuer can authorize one valid subject per credential generation."
status = "accepted"

[[threat]]
id = "THR-018"
mandatory_key = ""
title = "Forged request, attempt, ACK, or rejection"
priority = "P0"
owner_task = "T-G06-04"
scenario_ids = ["SC-G06-P0-01", "SC-G06-P0-02", "SC-G06-P0-14", "SC-G06-P0-15"]
mitigation = "Sign request/attempt by source and receipts by destination over exact cluster, trace, digest, ordinal, status, feature, and hop context; verify before state change."
residual = "Compromising an endpoint signing key permits authentic-looking messages for that identity."
status = "accepted"

[[threat]]
id = "THR-019"
mandatory_key = ""
title = "Early retention expiry and post-expiry redispatch"
priority = "P0"
owner_task = "T-G06-05"
scenario_ids = ["SC-G06-P0-18", "SC-G06-P0-19", "SC-G06-P0-20"]
mitigation = "Start TTL only at durable terminal commit, never refresh it, use conservative elapsed lower bounds, retain active traces, and test every clock/restart boundary."
residual = "After all destination deduplication records legitimately expire, a delayed duplicate may be accepted and dispatch again."
status = "accepted"

[[threat]]
id = "THR-020"
mandatory_key = ""
title = "Lost update, transaction identity reuse, and commit ambiguity"
priority = "P0"
owner_task = "T-G02-01"
scenario_ids = ["SC-G02-P0-01", "SC-G02-P1-01", "SC-G07-P0-07", "SC-G08-P0-02"]
mitigation = "Use immutable snapshots, base/per-key CAS, cross-family atomicity, unique TxnId plus operation digest, explicit outcomes, receipts, locked reconciliation and reference-safe cleanup."
residual = "An unavailable backend can leave writes frozen in Unknown until authoritative reopen."
status = "accepted"

[[threat]]
id = "THR-021"
mandatory_key = ""
title = "Storage corruption, rollback, unsafe durability claim, and hostile provider"
priority = "P0"
owner_task = "T-G02-05"
scenario_ids = ["SC-G02-P0-07", "SC-G02-P1-03", "SC-G08-P0-07", "SC-G08-P0-09"]
mitigation = "Use checksummed immutable generations or redb integrity, alias-safe locks, explicit capability refusal, durability barriers, provider intents, crash matrices, and fail-closed highest-generation validation."
residual = "A hostile OS/storage provider can forge durable reads or discard acknowledged writes; this is outside the library trust boundary."
status = "accepted"

[[threat]]
id = "THR-022"
mandatory_key = ""
title = "Migration ambiguity and persisted-schema downgrade"
priority = "P0"
owner_task = "T-G08-04"
scenario_ids = ["SC-G08-P0-10", "SC-G08-P0-11", "SC-G08-P0-12", "SC-G10-P0-03"]
mitigation = "Register immutable explicit edges, reject duplicate/cyclic/ambiguous/no-path/downgrade graphs, migrate transactionally, replay by exact implementation digest, and make older readers refuse."
residual = "Removing an already published reader or edge is a compatibility break and remains forbidden."
status = "accepted"

[[threat]]
id = "THR-023"
mandatory_key = ""
title = "Unsafe cleanup and stale replica resurrection"
priority = "P0"
owner_task = "T-G07-05"
scenario_ids = [
  "SC-G07-P0-13",
  "SC-G07-P0-14",
  "SC-G07-P0-15",
  "SC-G09-P0-15",
  "E2E-08",
]
mitigation = "Require exact winning tombstone CAS and non-default risk acknowledgement; atomically remove all local key records; expose only one G9 command; forbid automatic invocation."
residual = "An unknown offline stale value can reappear after all tombstones are explicitly cleaned; the caller accepts that irreversible risk."
status = "accepted"

[[threat]]
id = "THR-024"
mandatory_key = ""
title = "Evidence command injection, artifact poisoning, and corpus secret retention"
priority = "P0"
owner_task = "T-G01-04"
scenario_ids = ["SC-G01-P0-04", "SC-G01-P0-05", "SC-G10-P0-10", "SC-G10-P0-11"]
mitigation = "Use closed executable IDs and literal argv, no shell evaluation, allowlisted artifact fields, provenance review before hashing, secret scanning before minimization, and bounded normalized events."
residual = "Human corpus review and secret classifiers can miss novel sensitive encodings; rejected bytes are deleted before hashing."
status = "accepted"

[[threat]]
id = "THR-025"
mandatory_key = ""
title = "Evidence impact, cadence, or budget bypass"
priority = "P0"
owner_task = "T-G10-09"
scenario_ids = ["SC-G10-P0-27", "SC-G10-P0-29", "SC-G10-P0-35"]
mitigation = "Map every relevant path to affected verification, require complete budgets and uninterrupted attestations, reject unmapped paths, and validate the full release ledger on the candidate SHA."
residual = "Incorrectly classified source paths remain possible until independent review; ambiguous path matches fail closed."
status = "accepted"

[[threat]]
id = "THR-026"
mandatory_key = ""
title = "Rerun, exclusion, replacement, and product-failure masking"
priority = "P0"
owner_task = "T-G10-09"
scenario_ids = ["SC-G10-P0-28", "SC-G10-P0-29", "SC-G10-P0-36", "SC-G10-P0-37"]
mitigation = "Retain all attempts and predecessor digests, permit new lineage only for independently classified infrastructure failure, prohibit sample replacement, and validate every raw result."
residual = "Provider classification still requires trusted external evidence and reviewer judgment."
status = "accepted"

[[threat]]
id = "THR-027"
mandatory_key = ""
title = "Candidate, dependency lock, evidence ledger, token, tag, or artifact substitution"
priority = "P0"
owner_task = "T-G10-12"
scenario_ids = ["SC-G10-P0-34", "SC-G10-P0-38", "SC-G10-P0-39", "SC-G10-P0-40"]
mitigation = "Create immutable candidate first, bind all evidence/image/SBOM to SHA and Cargo.lock, issue an external signed eligibility token over the complete ledger, and guard tag/publish by exact match."
residual = "Compromise of protected CI signing and registry identities is outside the crate and requires platform controls."
status = "accepted"

[[threat]]
id = "THR-028"
mandatory_key = ""
title = "SLO shortcut, private-state access, profile falsification, or sample omission"
priority = "P0"
owner_task = "T-G10-10"
scenario_ids = [
  "SC-G10-P0-30",
  "SC-G10-P0-31",
  "SC-G10-P0-33",
  "SC-G10-P0-36",
  "E2E-10",
]
mitigation = "Use an external publish-false harness, separate control/data networks, public facade only, exact OCI/bridge/redb/topology profile, predeclared 125 samples, raw timings, negative shortcut tests, and no post-start exclusion."
residual = "The result applies only to the attested same-host unimpaired profile and not larger or impaired networks."
status = "accepted"

[[threat]]
id = "THR-029"
mandatory_key = ""
title = "Dependency, compiler, Cargo feature, or alternate implementation weakening"
priority = "P0"
owner_task = "T-G10-07"
scenario_ids = ["SC-G01-P0-07", "SC-G10-P0-20", "SC-G10-P0-21", "SC-G10-P0-22"]
mitigation = "Fix MSRV and lockfile, use additive features, keep security unconditional, run native powersets, deny unowned duplicates/sources/advisories, allow one TLS provider and one implementation per protocol role."
residual = "Future upstream vulnerabilities require advisory response and may force a documented dependency update."
status = "accepted"
