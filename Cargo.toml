[workspace]
members  = [".", "test-support"]
resolver = "3"

[package]
edition      = "2024"
name         = "minor-relay"
publish      = false
rust-version = "1.97.1"
version      = "0.1.0"

[dependencies]
ed25519-dalek = { version = "3.0", default-features = false, features = [
  "fast",
  "rand_core",
  "zeroize",
] }
getrandom = "0.4"
minicbor = { version = "2.3", features = ["derive", "std"] }
sha2 = "0.11"
tokio = { version = "1.53", features = ["rt", "sync", "time"] }

[build-dependencies]
sha2 = "0.11"

[dev-dependencies]
minor-relay-test-support = { path = "test-support" }
proptest = "1.11"
tokio = { version = "1.53", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "test-util",
  "time",
] }

[lints.rust]
unsafe_code = "forbid"
