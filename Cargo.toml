[workspace]
members  = [".", "test-support"]
resolver = "3"

[package]
edition      = "2024"
name         = "minor-relay"
publish      = false
rust-version = "1.97.1"
version      = "0.1.0"

[features]
default = ["json"]
json    = ["dep:fs4", "dep:rustix", "dep:serde", "dep:serde_json"]

[dependencies]
ed25519-dalek = { version = "3.0", default-features = false, features = [
  "fast",
  "rand_core",
  "zeroize",
] }
fs4 = { version = "1.1", optional = true }
getrandom = "0.4"
minicbor = { version = "2.3", features = ["derive", "std"] }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
sha2 = "0.11"
tokio = { version = "1.53", features = ["rt", "sync", "time"] }

[target."cfg(unix)".dependencies]
rustix = { version = "1.1", features = ["fs"], optional = true }

[build-dependencies]
sha2 = "0.11"

[dev-dependencies]
minor-relay-test-support = { path = "test-support" }
proptest = "1.11"
tempfile = "3.27"
tokio = { version = "1.53", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "test-util",
  "time",
] }

[lints.rust]
unsafe_code = "forbid"
