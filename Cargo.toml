[package]
edition      = "2024"
name         = "minor-relay"
publish      = false
rust-version = "1.97.1"
version      = "0.1.0"

[dependencies]
getrandom = "0.4.3"
minicbor = { version = "2.3.0", features = ["derive", "std"] }
tokio = { version = "1.53.1", features = ["rt", "sync", "time"] }

[dev-dependencies]
proptest = "1.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "test-util", "time"] }

[lints.rust]
unsafe_code = "forbid"
