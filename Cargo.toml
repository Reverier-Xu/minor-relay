[workspace]
members  = [".", "test-support"]
resolver = "3"

[package]
edition      = "2024"
name         = "minor-relay"
publish      = false
rust-version = "1.97.1"
version      = "0.1.0"

[features]
default = ["json"]
json    = ["dep:fs4", "dep:rustix", "dep:serde", "dep:serde_json"]

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["std"] }
ed25519-dalek = { version = "3.0", default-features = false, features = [
  "fast",
  "rand_core",
  "zeroize",
] }
fs4 = { version = "1.1", optional = true }
futures-util = { version = "0.3", default-features = false, features = [
  "std",
  "async-await",
  "sink",
] }
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
minicbor = { version = "2.3", features = ["derive", "std"] }
rcgen = { version = "0.14", default-features = false, features = [
  "crypto",
  "ring",
] }
rustls = { version = "0.23", default-features = false, features = [
  "std",
  "ring",
] }
secrecy = { version = "0.10", default-features = false }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
sha2 = "0.11"
tokio = { version = "1.53", features = [
  "rt",
  "sync",
  "time",
  "net",
  "io-util",
  "macros",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
  "handshake",
] }
tracing = { version = "0.1", default-features = false, features = [
  "std",
  "attributes",
] }
zeroize = "1.9"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1", features = ["fs", "process"], optional = true }

[build-dependencies]
sha2 = "0.11"

[dev-dependencies]
minor-relay-test-support = { path = "test-support" }
proptest = "1.11"
tempfile = "3.27"
tokio = { version = "1.53", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "test-util",
  "time",
] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wait-timeout = "0.2"

[lints.rust]
unsafe_code = "forbid"
