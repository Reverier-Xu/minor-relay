[workspace]
members  = [".", "test-support"]
resolver = "3"

[package]
edition      = "2024"
name         = "minor-relay"
publish      = false
rust-version = "1.97.1"
version      = "0.1.0"

[dependencies]
minicbor = { version = "2.3", features = ["derive", "std"] }
sha2     = "0.11"
tokio    = { version = "1.53", features = ["rt", "sync", "time"] }

[dev-dependencies]
minor-relay-test-support = { path = "test-support" }
proptest = "1.11"
tokio = { version = "1.53", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "test-util",
  "time",
] }

[lints.rust]
unsafe_code = "forbid"
