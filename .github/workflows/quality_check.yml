name: quality_check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install nightly rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly
          components: rustfmt

      - name: install taplo
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: taplo-cli@0.10.0

      - name: taplo fmt
        run: taplo fmt --check

      - name: cargo fmt
        run: cargo +nightly fmt --all -- --check

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install MSRV toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.0
          components: clippy

      - name: verify MSRV
        run: test "$(rustc +1.98.0 --version --verbose | awk '$1 == "release:" { print $2 }')" = "1.98.0"

      - name: cargo check
        run: cargo +1.98.0 check --workspace --all-targets --all-features --locked

      - name: cargo clippy
        run: cargo +1.98.0 clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        run: cargo +1.98.0 test --workspace --all-features --locked

  stable:
    name: stable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install stable rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy

      - name: report stable toolchain
        run: rustc +stable --version --verbose

      - name: cargo check
        run: cargo +stable check --workspace --all-targets --all-features --locked

      - name: cargo clippy
        run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        run: cargo +stable test --workspace --all-features --locked

  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 12
    env:
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install MSRV toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.0
          components: clippy

      - name: cargo check
        run: cargo +1.98.0 check --workspace --all-targets --all-features --locked

      - name: cargo clippy
        run: cargo +1.98.0 clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        run: cargo +1.98.0 test --workspace --all-features --locked

      - name: fixed simulator gate
        run: cargo +1.98.0 test --locked --lib simulation::network::tests::simulation_network_fault_matrix_gate -- --ignored --exact

  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install MSRV toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.0
          components: clippy

      - name: cargo check
        run: cargo +1.98.0 check --workspace --all-targets --all-features --locked

      - name: cargo clippy
        run: cargo +1.98.0 clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        run: cargo +1.98.0 test --workspace --all-features --locked

      - name: fixed simulator gate
        run: cargo +1.98.0 test --locked --lib simulation::network::tests::simulation_network_fault_matrix_gate -- --ignored --exact

  features:
    name: features
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install MSRV toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.0

      - name: install cargo-hack
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-hack@0.6.45

      - name: verify cargo-hack
        run: test "$(cargo hack --version)" = "cargo-hack 0.6.45"

      - name: feature powerset check
        run: cargo +1.98.0 hack check --feature-powerset --depth 1 --locked

      - name: feature powerset test
        run: cargo +1.98.0 hack test --feature-powerset --depth 1 --locked

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: build quality image
        run: docker build --file .github/docker/quality.Dockerfile --tag radiata-quality:${{ github.sha }} .

      - name: run container quality and simulator gate
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}/.git:/workspace/.git:ro"
          radiata-quality:${{ github.sha }}

  dependency-policy:
    name: dependency-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install stable rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable

      - name: install cargo-deny
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-deny@0.20.2

      - name: verify cargo-deny
        run: test "$(cargo deny --version)" = "cargo-deny 0.20.2"

      - name: cargo deny
        run: cargo deny --locked --workspace check

      - name: dependency duplicate review
        run: |
          cargo tree --locked --workspace -d > target/dependency-duplicates.txt
          cat target/dependency-duplicates.txt
          # Duplicate crate families in one protocol role are release blockers
          # (ADR-0004). The reviewed baseline names exactly these benign
          # duplicates across distinct roles; any new family fails the lane.
          # getrandom 0.3/0.4: proptest's transitive draw vs the crate's own.
          # windows-sys/windows-* stacks: platform crates from independent
          # dependencies at different minimum versions.
          jq -n \
            --arg schema "radiata.woooo.tech/schemas/dependency-duplicates-v1" \
            --rawfile duplicates target/dependency-duplicates.txt \
            '{schema: $schema, duplicates: $duplicates}' \
            > target/dependency-duplicates.json
